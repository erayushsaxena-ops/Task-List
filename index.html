  { text: "If you don't like something, change it. If you can't change it, change your attitude.", author: "Maya Angelou" },
  { text: "You can't go back and change the beginning, but you can start where you are and change the ending.", author: "C.S. Lewis" },
  { text: "Life belongs to the living, and he who lives must be prepared for changes.", author: "Johann Wolfgang von Goethe" },
  { text: "If you want to truly understand something, try to change it.", author: "Kurt Lewin" },
  { text: "All things must change to something new, to something strange.", author: "Henry Wadsworth Longfellow" },
  { text: "When you're finished changing, you're finished.", author: "Benjamin Franklin" },
  { text: "It is not the strongest of the species that survive, nor the most intelligent, but the one most responsive to change.", author: "Charles Darwin" },
  { text: "Life is change. Growth is optional. Choose wisely.", author: "Karen Kaiser Clark" },
  { text: "There is nothing permanent except change.", author: "Heraclitus" },
  { text: "It takes courage to grow up and become who you really are.", author: "e.e. cummings" },
  { text: "You must be the change you wish to see in the world.", author: "Mahatma Gandhi" },
  { text: "The measure of intelligence is the ability to change.", author: "Albert Einstein" },
  { text: "The greatest discovery of any generation is that a human being can alter his life by altering his attitude.", author: "William James" },
  { text: "Change your life today. Don't gamble on the future, act now, without delay.", author: "Simone de Beauvoir" },
  { text: "All our dreams can come true, if we have the courage to pursue them.", author: "Walt Disney" },
  { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt" },
  { text: "A dream doesn't become reality through magic; it takes sweat, determination and hard work.", author: "Colin Powell" },
  { text: "Dream big and dare to fail.", author: "Norman Vaughan" },
  { text: "I have a dream.", author: "Martin Luther King Jr." },
  { text: "Reach high, for stars lie hidden in your soul. Dream deep, for every dream precedes the goal.", author: "Pamela Vaull Starr" },
  { text: "Every great dream begins with a dreamer.", author: "Harriet Tubman" },
  { text: "If your dreams don't scare you, they aren't big enough.", author: "Ellen Johnson Sirleaf" },
  { text: "Don't tell people your dreams. Show them.", author: "Unknown" },
  { text: "Your dreams are the blueprint of your destiny.", author: "Unknown" },
  { text: "Dreams are not what you see in your sleep; dreams are things which do not let you sleep.", author: "Cristiano Ronaldo" },
  { text: "The only limit to our realization of tomorrow is our doubts of today.", author: "Franklin D. Roosevelt" },
  { text: "Dream big. Start small. But most of all, start.", author: "Simon Sinek" },
  { text: "The distance between dreams and reality is called action.", author: "Unknown" },
  { text: "If you can imagine it, you can achieve it. If you can dream it, you can become it.", author: "William Arthur Ward" },
  { text: "Dream as if you'll live forever. Live as if you'll die today.", author: "James Dean" },
  { text: "You are never too old to set another goal or to dream a new dream.", author: "C.S. Lewis" },
  { text: "Hold fast to dreams, for if dreams die, life is a broken-winged bird that cannot fly.", author: "Langston Hughes" },
  { text: "The secret of life is to have a task, something you devote your entire life to.", author: "Henry Moore" },
  { text: "A man is not old until regrets take the place of dreams.", author: "John Barrymore" },
  { text: "Gratitude is not only the greatest of virtues, but the parent of all others.", author: "Marcus Tullius Cicero" },
  { text: "When you are grateful, fear disappears and abundance appears.", author: "Tony Robbins" },
  { text: "Gratitude unlocks the fullness of life.", author: "Melody Beattie" },
  { text: "The things you take for granted, someone else is praying for.", author: "Unknown" },
  { text: "Appreciation can make a day, even change a life.", author: "Margaret Cousins" },
  { text: "Count your blessings, not your problems.", author: "Unknown" },
  { text: "Joy is what happens to us when we allow ourselves to recognize how good things really are.", author: "Marianne Williamson" },
  { text: "Wake at dawn with a winged heart and give thanks for another day of loving.", author: "Khalil Gibran" },
  { text: "It's not happy people who are thankful; it is thankful people who are happy.", author: "Unknown" },
  { text: "Gratitude is the sign of noble souls.", author: "Aesop" },
  { text: "The more grateful I am, the more beauty I see.", author: "Mary Davis" },
  { text: "Enough is a feast.", author: "Buddhist Proverb" },
  { text: "Look at everything always as though you were seeing it either for the first or last time.", author: "Betty Smith" },
  { text: "If the only prayer you ever say in your entire life is 'thank you', it will be enough.", author: "Meister Eckhart" },
  { text: "Happiness is not something readymade. It comes from your own actions.", author: "Dalai Lama" },
  { text: "Happiness cannot be traveled to, owned, earned, worn or consumed.", author: "Denis Waitley" },
  { text: "Most folks are as happy as they make up their minds to be.", author: "Abraham Lincoln" },
  { text: "The happiness of your life depends upon the quality of your thoughts.", author: "Marcus Aurelius" },
  { text: "For every minute you are angry you lose sixty seconds of happiness.", author: "Ralph Waldo Emerson" },
  { text: "Happiness is a journey, not a destination.", author: "Unknown" },
  { text: "Simplicity is the ultimate form of sophistication.", author: "Clare Booth Luce" },
  { text: "Nature is pleased with simplicity.", author: "Isaac Newton" },
  { text: "The ability to simplify means to eliminate the unnecessary so that the necessary may speak.", author: "Hans Hofmann" },
  { text: "Less is more.", author: "Ludwig Mies van der Rohe" },
  { text: "Simplicity is not the absence of clutter; that's a good description of emptiness.", author: "Jonathan Ive" },
  { text: "The greatest step toward a life of simplicity is to learn to let go.", author: "Steve Maraboli" },
  { text: "Have nothing in your house that you do not know to be useful or believe to be beautiful.", author: "William Morris" },
  { text: "The things you own end up owning you.", author: "Chuck Palahniuk" },
  { text: "Declutter your mind, your home, your heart. Remove everything that doesn't make you stronger.", author: "Unknown" },
  { text: "Reduce the complexity of life by eliminating the needless wants of life.", author: "Edwin Way Teale" },
  { text: "In character, in manner, in style, in all things, the supreme excellence is simplicity.", author: "Henry Wadsworth Longfellow" },
  { text: "To find simplicity in the complex and complexity in the simple is the mark of a master.", author: "Unknown" },
  { text: "Simple can be harder than complex.", author: "Steve Jobs" },
  { text: "Simplify, simplify.", author: "Henry David Thoreau" },
  { text: "In order to seek one's own direction, one must simplify the mechanics of ordinary, everyday life.", author: "Plato" },
  { text: "How you spend your time is how you spend your life.", author: "Unknown" },
  { text: "Time is the most valuable thing a man can spend.", author: "Theophrastus" },
  { text: "Time is what we want most, but what we use worst.", author: "William Penn" },
  { text: "The time you enjoy wasting is not wasted time.", author: "Bertrand Russell" },
  { text: "Time is the wisest counselor of all.", author: "Pericles" },
  { text: "Time flies over us, but leaves its shadow behind.", author: "Nathaniel Hawthorne" },
  { text: "Life is not measured by the number of breaths we take, but by the moments that take our breath away.", author: "Maya Angelou" },
  { text: "Legacy is not leaving something for people. It's leaving something in people.", author: "Peter Strople" },
  { text: "The best legacy we can leave is how we treated people.", author: "Unknown" },
  { text: "Carve your name on hearts, not tombstones.", author: "Shannon L. Alder" },
  { text: "The purpose of life is to live it, to taste experience to the utmost, to reach out eagerly and without fear for newer and richer experience.", author: "Eleanor Roosevelt" },
  { text: "We are the sum of all the people we have ever loved, and that's the greatest legacy of all.", author: "Pat Conroy" },
  { text: "What you do in life echoes in eternity.", author: "Maximus Decimus Meridius" },
  { text: "We are not human beings having a spiritual experience. We are spiritual beings having a human experience.", author: "Pierre Teilhard de Chardin" },
  { text: "Be not afraid of greatness. Some are born great, some achieve greatness, and some have greatness thrust upon 'em.", author: "William Shakespeare" },
  { text: "The harder I work, the luckier I get.", author: "Samuel Goldwyn" },
  { text: "There are no traffic jams along the extra mile.", author: "Roger Staubach" },
  { text: "Men are made stronger on realization that the helping hand they need is at the end of their own arm.", author: "Sidney J. Phillips" },
  { text: "Talent is cheaper than table salt. What separates the talented individual from the successful one is a lot of hard work.", author: "Stephen King" },
  { text: "Hard work spotlights the character of people: some turn up their sleeves, some turn up their noses, and some don't turn up at all.", author: "Sam Ewing" },
  { text: "The only place where success comes before work is in the dictionary.", author: "Vidal Sassoon" },
  { text: "Big shots are only little shots who keep shooting.", author: "Christopher Morley" },
  { text: "Genius is one percent inspiration and ninety-nine percent perspiration.", author: "Thomas Edison" },
  { text: "The best preparation for tomorrow is doing your best today.", author: "H. Jackson Brown Jr." },
  { text: "I never dreamed about success, I worked for it.", author: "Estée Lauder" },
  { text: "You have to fight through some bad days to earn the best days of your life.", author: "Unknown" },
  { text: "If you're going through hell, keep going.", author: "Winston Churchill" },
  { text: "Nothing ever comes to one that is worth having except as a result of hard work.", author: "Booker T. Washington" },
  { text: "Effort is the one factor that makes you better than everyone else.", author: "Unknown" },
  { text: "Work while they sleep. Learn while they party. Save while they spend. Live like they dream.", author: "Unknown" },
  { text: "Talent is given, greatness is earned.", author: "Unknown" },
  { text: "Work until your idols become your rivals.", author: "Unknown" },
  { text: "Don't watch the clock; do what it does. Keep going.", author: "Sam Levenson" },
  { text: "The only way to achieve the impossible is to believe it is possible.", author: "Charles Kingsleigh" },
  { text: "Character is like a tree and reputation is like a shadow.", author: "Abraham Lincoln" },
  { text: "Be more concerned with your character than your reputation.", author: "John Wooden" },
  { text: "A person's character is their fate.", author: "Heraclitus" },
  { text: "Real integrity is doing the right thing, knowing that nobody's going to know whether you did it or not.", author: "Oprah Winfrey" },
  { text: "The time is always right to do what is right.", author: "Martin Luther King Jr." },
  { text: "Integrity is doing the right thing, even when no one is watching.", author: "C.S. Lewis" },
  { text: "You are what you do, not what you say you'll do.", author: "Carl Jung" },
  { text: "The strength of a man's virtue should not be measured by his special exertions, but by his habitual acts.", author: "Blaise Pascal" },
  { text: "How you do anything is how you do everything.", author: "Unknown" },
  { text: "A man is the sum of his actions, of what he has done, of what he can do, nothing else.", author: "Mahatma Gandhi" },
  { text: "Honor your commitments with integrity.", author: "Les Brown" },
  { text: "Ethics is knowing the difference between what you have a right to do and what is right to do.", author: "Potter Stewart" },
  { text: "In matters of style, swim with the current; in matters of principle, stand like a rock.", author: "Thomas Jefferson" },
  { text: "Live so that when your children think of fairness and integrity, they think of you.", author: "H. Jackson Brown Jr." },
  { text: "You can easily judge the character of a man by how he treats those who can do nothing for him.", author: "Malcolm S. Forbes" },
  { text: "The measure of a man's character is what he would do if he knew he never would be found out.", author: "Thomas Babington Macaulay" },
  { text: "Be the kind of person you would like to meet.", author: "Unknown" },
  { text: "People of good character judge themselves more harshly than others judge them.", author: "Marcelene Cox" },
  { text: "Our greatest glory is not in never failing, but in rising every time we fall.", author: "Confucius" },
  { text: "Begin with the end in mind.", author: "Stephen Covey" },
  { text: "Strategy without tactics is the slowest route to victory. Tactics without strategy is the noise before defeat.", author: "Sun Tzu" },
  { text: "Good business leaders create a vision, articulate the vision, passionately own the vision, and relentlessly drive it to completion.", author: "Jack Welch" },
  { text: "Setting goals is the first step in turning the invisible into the visible.", author: "Tony Robbins" },
  { text: "A goal without a plan is just a wish.", author: "Antoine de Saint-Exupéry" },
  { text: "All successful people have a goal. No one can get anywhere unless he knows where he wants to go and what he wants to be or do.", author: "Norman Vincent Peale" },
  { text: "If you don't know where you are going, any road will take you there.", author: "Lewis Carroll" },
  { text: "It's not enough to be busy, so are the ants. The question is, what are we busy about?", author: "Henry David Thoreau" },
  { text: "The trouble with not having a goal is that you can spend your life running up and down the field and never score.", author: "Bill Copeland" },
  { text: "You don't have to see the whole staircase, just take the first step.", author: "Martin Luther King Jr." },
  { text: "Big goals get big results. No goals gets no results or somebody else's results.", author: "Mark Victor Hansen" },
  { text: "The secret of success is learning how to use pain and pleasure instead of having pain and pleasure use you.", author: "Tony Robbins" },
  { text: "Think big. Start small. Move fast.", author: "Gary Hamel" },
  { text: "Victorious warriors win first and then go to war, while defeated warriors go to war first and then seek to win.", author: "Sun Tzu" },
  { text: "The best way to predict the future is to invent it.", author: "Alan Kay" },
  { text: "Plan your work for today and every day, then work your plan.", author: "Margaret Thatcher" },
  { text: "What gets measured gets managed.", author: "Peter Drucker" },
  { text: "If you fail to plan, you are planning to fail.", author: "Benjamin Franklin" },
  { text: "Plans are nothing; planning is everything.", author: "Dwight D. Eisenhower" },
  { text: "The will to win, the desire to succeed, the urge to reach your full potential... these are the keys that will unlock the door to personal excellence.", author: "Confucius" },
  { text: "In every walk with nature, one receives far more than he seeks.", author: "John Muir" },
  { text: "Look deep into nature, and then you will understand everything better.", author: "Albert Einstein" },
  { text: "The clearest way into the Universe is through a forest wilderness.", author: "John Muir" },
  { text: "We are not apart from nature; we are a part of nature.", author: "Unknown" },
  { text: "To forget how to dig the earth and to tend the soil is to forget ourselves.", author: "Mahatma Gandhi" },
  { text: "The mountains are calling and I must go.", author: "John Muir" },
  { text: "Study nature, love nature, stay close to nature. It will never fail you.", author: "Frank Lloyd Wright" },
  { text: "Nature does not hurry, yet everything is accomplished.", author: "Lao Tzu" },
  { text: "Adopt the pace of nature: her secret is patience.", author: "Ralph Waldo Emerson" },
  { text: "One touch of nature makes the whole world kin.", author: "William Shakespeare" },
  { text: "Look up at the stars and not down at your feet.", author: "Stephen Hawking" },
  { text: "Two things are infinite: the universe and human stupidity; and I'm not sure about the universe.", author: "Albert Einstein" },
  { text: "Space is big. You just won't believe how vastly, hugely, mind-bogglingly big it is.", author: "Douglas Adams" },
  { text: "The cosmos is within us. We are made of star-stuff.", author: "Carl Sagan" },
  { text: "The nitrogen in our DNA, the calcium in our teeth, the iron in our blood — were made in the interiors of collapsing stars.", author: "Carl Sagan" },
  { text: "If you think you are too small to make a difference, try sleeping with a mosquito.", author: "Dalai Lama" },
  { text: "I am an optimist. It does not seem too much use being anything else.", author: "Winston Churchill" },
  { text: "The brain is a wonderful organ; it starts working the moment you get up in the morning and does not stop until you get into the office.", author: "Robert Frost" },
  { text: "Age is something that doesn't matter, unless you are a cheese.", author: "Luis Buñuel" },
  { text: "If you live to be one hundred, you've got it made. Very few people die past that age.", author: "George Burns" },
  { text: "Going to church doesn't make you a Christian any more than going to a garage makes you an automobile.", author: "Billy Sunday" },
  { text: "Never put off till tomorrow what you can do the day after tomorrow just as well.", author: "Mark Twain" },
  { text: "Everything is funny, as long as it's happening to someone else.", author: "Will Rogers" },
  { text: "The secret to staying young is to live honestly, eat slowly, and lie about your age.", author: "Lucille Ball" },
  { text: "I don't want to achieve immortality through my work; I want to achieve it by not dying.", author: "Woody Allen" },
  { text: "The will to win is important, but the will to prepare is vital.", author: "Joe Paterno" },
  { text: "Champions aren't made in the gyms. Champions are made from something they have deep inside them — a desire, a dream, a vision.", author: "Muhammad Ali" },
  { text: "Float like a butterfly, sting like a bee.", author: "Muhammad Ali" },
  { text: "It's hard to beat a person who never gives up.", author: "Babe Ruth" },
  { text: "The difference between the impossible and the possible lies in a person's determination.", author: "Tommy Lasorda" },
  { text: "Winning is not a sometime thing; it's an all-the-time thing.", author: "Vince Lombardi" },
  { text: "The more difficult the victory, the greater the happiness in winning.", author: "Pelé" },
  { text: "Pain is temporary. It may last a minute, or an hour, or a day, or a year, but eventually it will subside and something else will take its place.", author: "Lance Armstrong" },
  { text: "The only way to prove you are a good sport is to lose.", author: "Ernie Banks" },
  { text: "One man practicing sportsmanship is far better than a hundred teaching it.", author: "Knute Rockne" },
  { text: "Excellence is not a singular act, but a habit.", author: "Aristotle" },
  { text: "Hard work beats talent when talent doesn't work hard.", author: "Tim Notke" },
  { text: "You have to expect things of yourself before you can do them.", author: "Michael Jordan" },
  { text: "I can accept failure, everyone fails at something. But I can't accept not trying.", author: "Michael Jordan" },
  { text: "Talent wins games, but teamwork and intelligence wins championships.", author: "Michael Jordan" },
  { text: "The entrepreneur always searches for change, responds to it, and exploits it as an opportunity.", author: "Peter Drucker" },
  { text: "I knew that if I failed I wouldn't regret that, but I knew the one thing I might regret is not trying.", author: "Jeff Bezos" },
  { text: "The biggest risk is not taking any risk.", author: "Mark Zuckerberg" },
  { text: "Your most unhappy customers are your greatest source of learning.", author: "Bill Gates" },
  { text: "It's fine to celebrate success but it is more important to heed the lessons of failure.", author: "Bill Gates" },
  { text: "Move fast and break things. Unless you are breaking stuff, you are not moving fast enough.", author: "Mark Zuckerberg" },
  { text: "The only thing worse than starting something and failing... is not starting something.", author: "Seth Godin" },
  { text: "Do or do not. There is no try.", author: "Yoda" },
  { text: "Whether you think you can, or you think you can't — you're right.", author: "Henry Ford" },
  { text: "It does not matter how many times you get knocked down, but how many times you get up.", author: "Vince Lombardi" },
  { text: "The secret of getting ahead is getting started.", author: "Mark Twain" },
  { text: "We must embrace pain and burn it as fuel for our journey.", author: "Kenji Miyazawa" },
  { text: "Life is not about finding yourself. Life is about creating yourself.", author: "George Bernard Shaw" },
  { text: "Entrepreneurship is living a few years of your life like most people won't, so you can spend the rest of your life like most people can't.", author: "Unknown" },
  { text: "The value of an idea lies in the using of it.", author: "Thomas Edison" },
  { text: "Ideas without execution are just hallucinations.", author: "Thomas Edison" },
  { text: "Small opportunities are often the beginning of great enterprises.", author: "Demosthenes" },
  { text: "Make your product easier to buy than your competition, or you will find your customers buying from them, not you.", author: "Mark Cuban" },
  { text: "Life can only be understood backwards; but it must be lived forwards.", author: "Søren Kierkegaard" },
  { text: "We are what we pretend to be, so we must be careful about what we pretend to be.", author: "Kurt Vonnegut" },
  { text: "The good life is one inspired by love and guided by knowledge.", author: "Bertrand Russell" },
  { text: "We make a living by what we get, but we make a life by what we give.", author: "Winston Churchill" },
  { text: "In three words I can sum up everything I've learned about life: it goes on.", author: "Robert Frost" },
  { text: "To love and be loved is to feel the sun from both sides.", author: "David Viscott" },
  { text: "The most courageous act is still to think for yourself. Aloud.", author: "Coco Chanel" },
  { text: "The question is not what you look at, but what you see.", author: "Henry David Thoreau" },
  { text: "Reality is merely an illusion, albeit a very persistent one.", author: "Albert Einstein" },
  { text: "I am enough of an artist to draw freely upon my imagination.", author: "Albert Einstein" },
  { text: "If you want to live a happy life, tie it to a goal, not to people or objects.", author: "Albert Einstein" },
  { text: "The art of living is more like wrestling than dancing.", author: "Marcus Aurelius" },
  { text: "You don't need to be positive all the time. It's perfectly okay to feel sad, angry, annoyed, frustrated, scared, or anxious.", author: "Lori Deschene" },
  { text: "The only way to make sense out of change is to plunge into it, move with it, and join the dance.", author: "Alan Watts" },
  { text: "Flow with whatever may happen and let your mind be free.", author: "Zhuangzi" },
  { text: "Do not let the behavior of others destroy your inner peace.", author: "Dalai Lama" },
  { text: "Very little is needed to make a happy life; it is all within yourself, in your way of thinking.", author: "Marcus Aurelius" },
  { text: "An educated mind is able to entertain a thought without accepting it.", author: "Aristotle" },
  { text: "Knowledge is power.", author: "Francis Bacon" },
  { text: "The more you know, the more you realize you don't know.", author: "Aristotle" },
  { text: "The roots of education are bitter, but the fruit is sweet.", author: "Aristotle" },
  { text: "It is a miracle that curiosity survives formal education.", author: "Albert Einstein" },
  { text: "Curiosity is the engine of achievement.", author: "Ken Robinson" },
  { text: "I have no special talent. I am only passionately curious.", author: "Albert Einstein" },
  { text: "Reading is to the mind what exercise is to the body.", author: "Joseph Addison" },
  { text: "Books are the mirrors of the soul.", author: "Virginia Woolf" },
  { text: "A reader lives a thousand lives before he dies. The man who never reads lives only one.", author: "George R.R. Martin" },
  { text: "Not all readers are leaders, but all leaders are readers.", author: "Harry S. Truman" },
  { text: "Reading makes a full man; conference a ready man; and writing an exact man.", author: "Francis Bacon" },
  { text: "Outside of a dog, a book is a man's best friend.", author: "Groucho Marx" },
  { text: "No matter how busy you may think you are, you must find time for reading, or surrender yourself to self-chosen ignorance.", author: "Confucius" },
  { text: "I find television very educational. Every time somebody turns on the set, I go into the other room and read a book.", author: "Groucho Marx" },
  { text: "Once you learn to read, you will be forever free.", author: "Frederick Douglass" },
  { text: "A well-read woman is a dangerous creature.", author: "Lisa Kleypas" },
  { text: "There is no friend as loyal as a book.", author: "Ernest Hemingway" },
  { text: "Patience is a virtue.", author: "William Langland" },
  { text: "The strongest of all warriors are these two — Time and Patience.", author: "Leo Tolstoy" },
  { text: "Everything comes to him who hustles while he waits.", author: "Thomas Edison" },
  { text: "Good things come to those who wait, but only what's left by those who hustle.", author: "Abraham Lincoln" },
  { text: "One moment of patience may ward off great disaster. One moment of impatience may ruin a whole life.", author: "Chinese Proverb" },
  { text: "Rivers know this: there is no hurry. We shall get there some day.", author: "A.A. Milne" },
  { text: "Never cut a tree down in the wintertime. Never make a negative decision in the low time.", author: "Robert H. Schuller" },
  { text: "Have patience with all things, but first of all with yourself.", author: "Saint Francis de Sales" },
  { text: "Patience and time do more than strength or passion.", author: "Jean de La Fontaine" },
  { text: "A man who is a master of patience is master of everything else.", author: "George Savile" },
  { text: "The key to everything is patience. You get the chicken by hatching the egg, not by smashing it.", author: "Arnold H. Glasgow" },
  { text: "He that can have patience can have what he will.", author: "Benjamin Franklin" },
  { text: "Patience is not the ability to wait, but the ability to keep a good attitude while waiting.", author: "Joyce Meyer" },
  { text: "To love oneself is the beginning of a lifelong romance.", author: "Oscar Wilde" },
  { text: "Believe in yourself! Have faith in your abilities!", author: "Norman Vincent Peale" },
  { text: "Trust yourself. You know more than you think you do.", author: "Benjamin Spock" },
  { text: "The most common form of despair is not being who you are.", author: "Soren Kierkegaard" },
  { text: "Always be a first-rate version of yourself, instead of a second-rate version of somebody else.", author: "Judy Garland" },
  { text: "Confidence comes not from always being right but from not fearing to be wrong.", author: "Peter T. Mcintyre" },
  { text: "One important key to success is self-confidence. An important key to self-confidence is preparation.", author: "Arthur Ashe" },
  { text: "What you think of yourself is much more important than what others think of you.", author: "Seneca" },
  { text: "It took me quite a long time to develop a voice, and now that I have it, I am not going to be silent.", author: "Madeleine Albright" },
  { text: "Confidence is preparation. Everything else is beyond your control.", author: "Richard Kline" },
  { text: "You are more powerful than you know; you are beautiful just as you are.", author: "Melissa Etheridge" },
  { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" },
  { text: "Your only limit is your mind.", author: "Unknown" },
  { text: "Don't be pushed around by the fears in your mind. Be led by the dreams in your heart.", author: "Roy T. Bennett" },
  { text: "You have within you right now, everything you need to deal with whatever the world can throw at you.", author: "Brian Tracy" },
  { text: "The way to get started is to quit talking and begin doing.", author: "Walt Disney" },
  { text: "Don't wait. The time will never be just right.", author: "Napoleon Hill" },
  { text: "Well done is better than well said.", author: "Benjamin Franklin" },
  { text: "Take the first step in faith. You don't have to see the whole staircase, just take the first step.", author: "Martin Luther King Jr." },
  { text: "Whatever you can do, or dream you can do, begin it. Boldness has genius, power, and magic in it.", author: "Johann Wolfgang von Goethe" },
  { text: "Do what you can, with what you have, where you are.", author: "Theodore Roosevelt" },
  { text: "I took a deep breath and listened to the old brag of my heart: I am, I am, I am.", author: "Sylvia Plath" },
  { text: "Act as if what you do makes a difference. It does.", author: "William James" },
  { text: "An ounce of action is worth a ton of theory.", author: "Ralph Waldo Emerson" },
  { text: "Stop waiting for Friday, for summer, for someone to fall in love with you.", author: "Unknown" },
  { text: "If not now, when? If not you, who?", author: "Hillel the Elder" },
  { text: "Take action! An inch of movement will bring you closer to your goals than a mile of intention.", author: "Steve Maraboli" },
  { text: "Do something today that your future self will thank you for.", author: "Sean Patrick Flanery" },
  { text: "Begin anywhere.", author: "John Cage" },
  { text: "You don't have to be great to start, but you have to start to be great.", author: "Zig Ziglar" },
  { text: "Knowing is not enough; we must apply. Willing is not enough; we must do.", author: "Johann Wolfgang von Goethe" },
  { text: "Peace is not the absence of conflict; it is the ability to handle conflict by peaceful means.", author: "Ronald Reagan" },
  { text: "Learn to be calm and you will always be happy.", author: "Paramahansa Yogananda" },
  { text: "Nothing is so important that it should disturb your inner peace.", author: "Unknown" },
  { text: "When you find peace within yourself, you become the kind of person who can live at peace with others.", author: "Peace Pilgrim" },
  { text: "Serenity is not freedom from the storm, but peace within the storm.", author: "Unknown" },
  { text: "Accept what is, let go of what was, and have faith in what will be.", author: "Sonia Ricotti" },
  { text: "Make peace with your past so it won't mess up your present.", author: "Unknown" },
  { text: "God, grant me the serenity to accept the things I cannot change, courage to change the things I can, and wisdom to know the difference.", author: "Reinhold Niebuhr" },
  { text: "When you stop expecting people to be perfect, you can like them for who they are.", author: "Donald Miller" },
  { text: "True peace is not merely the absence of tension: it is the presence of justice.", author: "Martin Luther King Jr." },
  { text: "If you have a problem that can be fixed, then there is no use in worrying. If you have a problem that cannot be fixed, then there is no use in worrying.", author: "Buddhist Saying" },
  { text: "There is no path to peace. Peace is the path.", author: "Mahatma Gandhi" },
  { text: "Within you there is a stillness and sanctuary to which you can retreat at any time.", author: "Hermann Hesse" },
  { text: "Peace comes from within. Do not seek it without.", author: "Buddha" },
  { text: "Push yourself, because no one else is going to do it for you.", author: "Unknown" },
  { text: "Great things never come from comfort zones.", author: "Unknown" },
  { text: "Dream it. Wish it. Do it.", author: "Unknown" },
  { text: "Stay focused and never give up.", author: "Unknown" },
  { text: "The key to success is to start before you are ready.", author: "Marie Forleo" },
  { text: "Work hard in silence, let success make the noise.", author: "Frank Ocean" },
  { text: "Success doesn't come to you, you go to it.", author: "Marva Collins" },
  { text: "Chase the vision, not the money.", author: "Tony Hsieh" },
  { text: "Be so good they can't ignore you.", author: "Steve Martin" },
  { text: "Create the highest, grandest vision possible for your life because you become what you believe.", author: "Oprah Winfrey" },
  { text: "Go confidently in the direction of your dreams.", author: "Henry David Thoreau" },
  { text: "Everything you can imagine is real.", author: "Pablo Picasso" },
  { text: "The worst thing I can be is the same as everybody else.", author: "Arnold Schwarzenegger" },
  { text: "Make each day your masterpiece.", author: "John Wooden" },
  { text: "There is only one way to eat an elephant: a bite at a time.", author: "Desmond Tutu" },
  { text: "Aim for the moon. If you miss, you may hit a star.", author: "W. Clement Stone" },
  { text: "What we fear doing most is usually what we most need to do.", author: "Timothy Ferriss" },
  { text: "Your life does not get better by chance, it gets better by change.", author: "Jim Rohn" },
  { text: "Be the best version of yourself in everything you do.", author: "LeBron James" },
  { text: "We suffer more in imagination than in reality.", author: "Seneca" },
  { text: "It is not the man who has too little that is poor, but the man who hankers after more.", author: "Seneca" },
  { text: "Do not indulge in dreams of having what you have not, but reckon up the chief of the blessings you do possess.", author: "Marcus Aurelius" },
  { text: "How much time he saves who does not look to see what his neighbor says or does or thinks.", author: "Marcus Aurelius" },
  { text: "Everything we hear is an opinion, not a fact. Everything we see is a perspective, not the truth.", author: "Marcus Aurelius" },
  { text: "Reject your sense of injury and the injury itself disappears.", author: "Marcus Aurelius" },
  { text: "Waste no more time arguing about what a good man should be. Be one.", author: "Marcus Aurelius" },
  { text: "Never let the future disturb you. You will meet it, if you have to, with the same weapons of reason which today arm you against the present.", author: "Marcus Aurelius" },
  { text: "If it is not right, do not do it; if it is not true, do not say it.", author: "Marcus Aurelius" },
  { text: "Before enlightenment, chop wood, carry water. After enlightenment, chop wood, carry water.", author: "Zen Saying" },
  { text: "When you realize there is nothing lacking, the whole world belongs to you.", author: "Lao Tzu" },
  { text: "Life is a series of natural and spontaneous changes. Don't resist them.", author: "Lao Tzu" },
  { text: "To the mind that is still, the whole universe surrenders.", author: "Lao Tzu" },
  { text: "If you correct your mind, the rest of your life will fall into place.", author: "Lao Tzu" },
  { text: "Act without expectation.", author: "Lao Tzu" },
  { text: "The key to growth is the introduction of higher dimensions of consciousness into our awareness.", author: "Lao Tzu" },
  { text: "The man who asks a question is a fool for a minute, the man who does not ask is a fool for life.", author: "Confucius" },
  { text: "Real knowledge is to know the extent of one's ignorance.", author: "Confucius" },
  { text: "I hear and I forget. I see and I remember. I do and I understand.", author: "Confucius" },
  { text: "The superior man thinks always of virtue; the common man thinks of comfort.", author: "Confucius" },
  { text: "When it is obvious that the goals cannot be reached, don't adjust the goals, adjust the action steps.", author: "Confucius" },
  { text: "If you make one mistake, don't double it.", author: "Confucius" },
  { text: "Without feelings of respect, what is there to distinguish men from beasts?", author: "Confucius" },
  { text: "To see what is right and not do it is cowardice.", author: "Confucius" },
  { text: "It takes a village to raise a child.", author: "African Proverb" },
  { text: "If you want to go fast, go alone. If you want to go far, go together.", author: "African Proverb" },
  { text: "Until the lion tells his side of the story, the tale of the hunt will always glorify the hunter.", author: "African Proverb" },
  { text: "However long the night, the dawn will break.", author: "African Proverb" },
  { text: "A child who is not embraced by the village will burn it down to feel its warmth.", author: "African Proverb" },
  { text: "When the music changes, so does the dance.", author: "African Proverb" },
  { text: "Every morning in Africa, a gazelle wakes up knowing it must run faster than the fastest lion or it will be killed.", author: "African Proverb" },
  { text: "Wisdom is like a baobab tree; no one individual can embrace it.", author: "African Proverb" },
  { text: "The wise do not sit idle and allow things to happen to them.", author: "African Proverb" },
  { text: "Rain does not fall on one roof alone.", author: "African Proverb" },
  { text: "The soul that sees beauty may sometimes walk alone.", author: "Johann Wolfgang von Goethe" },
  { text: "There are only two ways to live your life. One is as though nothing is a miracle. The other is as though everything is a miracle.", author: "Albert Einstein" },
  { text: "Not until we are lost do we begin to understand ourselves.", author: "Henry David Thoreau" },
  { text: "The privilege of a lifetime is being who you are.", author: "Joseph Campbell" },
  { text: "Follow your bliss.", author: "Joseph Campbell" },
  { text: "The cave you fear to enter holds the treasure you seek.", author: "Joseph Campbell" },
  { text: "We must be willing to let go of the life we planned so as to have the life that is waiting for us.", author: "Joseph Campbell" },
  { text: "Where you stumble, there lies your treasure.", author: "Joseph Campbell" },
  { text: "Life is without meaning. You bring the meaning to it.", author: "Joseph Campbell" },
  { text: "The eternal quest of the individual human being is to shatter his loneliness.", author: "Norman Cousins" },
  { text: "The sacred is everywhere, if we allow ourselves to see it.", author: "Unknown" },
  { text: "Your task is not to seek for love, but merely to seek and find all the barriers within yourself that you have built against it.", author: "Rumi" },
  { text: "Out beyond ideas of wrongdoing and rightdoing there is a field. I'll meet you there.", author: "Rumi" },
  { text: "Let the beauty we love be what we do.", author: "Rumi" },
  { text: "The wound is the place where the Light enters you.", author: "Rumi" },
  { text: "Stop acting so small. You are the universe in ecstatic motion.", author: "Rumi" },
  { text: "You are not a drop in the ocean. You are the entire ocean in a drop.", author: "Rumi" },
  { text: "Sell your cleverness and buy bewilderment.", author: "Rumi" },
  { text: "Be like water making its way through cracks.", author: "Bruce Lee" },
  { text: "Be water, my friend.", author: "Bruce Lee" },
  { text: "Family is not an important thing. It's everything.", author: "Michael J. Fox" },
  { text: "In family life, love is the oil that eases friction, the cement that binds closer together, and the music that brings harmony.", author: "Friedrich Nietzsche" },
  { text: "The love of family and the admiration of friends is much more important than wealth and privilege.", author: "Charles Kuralt" },
  { text: "You don't choose your family. They are God's gift to you, as you are to them.", author: "Desmond Tutu" },
  { text: "Other things may change us, but we start and end with family.", author: "Anthony Brandt" },
  { text: "A happy family is but an earlier heaven.", author: "George Bernard Shaw" },
  { text: "Home is where the heart is.", author: "Pliny the Elder" },
  { text: "Children are the world's most valuable resource and its best hope for the future.", author: "John F. Kennedy" },
  { text: "Parents can only give good advice or put them on the right paths, but the final forming of a person's character lies in their own hands.", author: "Anne Frank" },
  { text: "It is not flesh and blood but the heart which makes us fathers and sons.", author: "Friedrich Schiller" },
  { text: "Fear is a reaction. Courage is a decision.", author: "Winston Churchill" },
  { text: "You gain strength, courage, and confidence by every experience in which you really stop to look fear in the face.", author: "Eleanor Roosevelt" },
  { text: "I have learned that courage was not the absence of fear, but the triumph over it.", author: "Nelson Mandela" },
  { text: "The brave man is not he who does not feel afraid, but he who conquers that fear.", author: "Nelson Mandela" },
  { text: "Don't be afraid of your fears. They're not there to scare you. They're there to let you know that something is worth it.", author: "C. JoyBell C." },
  { text: "If you are distressed by anything external, the pain is not due to the thing itself, but to your estimate of it; and this you have the power to revoke at any moment.", author: "Marcus Aurelius" },
  { text: "Fear keeps us focused on the past or worried about the future. If we can acknowledge our fear, we can realize that right now we are okay.", author: "Thich Nhat Hanh" },
  { text: "I must not fear. Fear is the mind-killer.", author: "Frank Herbert" },
  { text: "Do the thing you fear to do and keep on doing it.", author: "Dale Carnegie" },
  { text: "Failure is the condiment that gives success its flavor.", author: "Truman Capote" },
  { text: "There is no failure except in no longer trying.", author: "Elbert Hubbard" },
  { text: "We learn from failure, not from success!", author: "Bram Stoker" },
  { text: "Success is not built on success. It's built on failure. It's built on frustration.", author: "Sumner Redstone" },
  { text: "If you learn from defeat, you haven't really lost.", author: "Zig Ziglar" },
  { text: "I have not failed. I've just found 10,000 ways that won't work.", author: "Thomas Edison" },
  { text: "Mistakes are always forgivable, if one has the courage to admit them.", author: "Bruce Lee" },
  { text: "Never let the fear of striking out keep you from playing the game.", author: "Babe Ruth" },
  { text: "Failure is only the opportunity to begin again, this time more intelligently.", author: "Henry Ford" },
  { text: "It's okay to fail. It's not okay to not try.", author: "Unknown" },
  { text: "I've missed more than 9,000 shots in my career. I've lost almost 300 games. 26 times, I've been trusted to take the game winning shot and missed. I've failed over and over and over again in my life.", author: "Michael Jordan" },
  { text: "You build on failure. You use it as a stepping stone.", author: "Johnny Cash" },
  { text: "One who makes no mistakes makes nothing at all.", author: "Giacomo Casanova" },
  { text: "Only those who dare to fail greatly can ever achieve greatly.", author: "Robert F. Kennedy" },
  { text: "Art enables us to find ourselves and lose ourselves at the same time.", author: "Thomas Merton" },
  { text: "Every artist dips his brush in his own soul, and paints his own nature into his pictures.", author: "Henry Ward Beecher" },
  { text: "Music gives color to the air of the moment.", author: "Karl Lagerfeld" },
  { text: "Art washes away from the soul the dust of everyday life.", author: "Pablo Picasso" },
  { text: "The purpose of art is washing the dust of daily life off our souls.", author: "Pablo Picasso" },
  { text: "Without music, life would be a mistake.", author: "Friedrich Nietzsche" },
  { text: "Music is the shorthand of emotion.", author: "Leo Tolstoy" },
  { text: "One good thing about music, when it hits you, you feel no pain.", author: "Bob Marley" },
  { text: "To create one's own world in any of the arts takes courage.", author: "Georgia O'Keeffe" },
  { text: "Art is not what you see, but what you make others see.", author: "Edgar Degas" },
  { text: "Beauty is in the eye of the beholder.", author: "Margaret Wolfe Hungerford" },
  { text: "Everything has beauty, but not everyone sees it.", author: "Confucius" },
  { text: "Beauty will save the world.", author: "Fyodor Dostoevsky" },
  { text: "The most beautiful thing we can experience is the mysterious.", author: "Albert Einstein" },
  { text: "Art is a lie that makes us realize truth.", author: "Pablo Picasso" },
  { text: "The truth will set you free, but first it will make you miserable.", author: "James A. Garfield" },
  { text: "There are three things you can't hide: the sun, the moon and the truth.", author: "Buddha" },
  { text: "Truth is powerful and it prevails.", author: "Sojourner Truth" },
  { text: "A lie gets halfway around the world before the truth has a chance to put on its pants.", author: "Winston Churchill" },
  { text: "If you tell the truth, you don't have to remember anything.", author: "Mark Twain" },
  { text: "Honesty is the best policy.", author: "Benjamin Franklin" },
  { text: "In a time of deceit, telling the truth is a revolutionary act.", author: "George Orwell" },
  { text: "Better to be slapped with the truth than kissed with a lie.", author: "Russian Proverb" },
  { text: "Truth never damages a cause that is just.", author: "Mahatma Gandhi" },
  { text: "Love is not what you say. Love is what you do.", author: "Unknown" },
  { text: "The best thing to hold onto in life is each other.", author: "Audrey Hepburn" },
  { text: "We loved with a love that was more than love.", author: "Edgar Allan Poe" },
  { text: "Love all, trust a few, do wrong to none.", author: "William Shakespeare" },
  { text: "Love begins by taking care of the closest ones.", author: "Mother Teresa" },
  { text: "I have decided to stick with love. Hate is too great a burden to bear.", author: "Martin Luther King Jr." },
  { text: "Love is that condition in which the happiness of another person is essential to your own.", author: "Robert A. Heinlein" },
  { text: "Life is the flower for which love is the honey.", author: "Victor Hugo" },
  { text: "Where there is love there is life.", author: "Mahatma Gandhi" },
  { text: "The only disability in life is a bad attitude.", author: "Scott Hamilton" },
  { text: "Life is 10% what happens to you and 90% how you react to it.", author: "Charles R. Swindoll" },
  { text: "Two men looked out from prison bars, one saw the mud, the other saw stars.", author: "Dale Carnegie" },
  { text: "Everything you've ever wanted is on the other side of fear.", author: "George Addair" },
  { text: "When one door closes, another opens; but we often look so long at the closed door that we do not see the one which has opened for us.", author: "Alexander Graham Bell" },
  { text: "Some people see the glass half full. Others see it half empty. I see a glass that's twice as big as it needs to be.", author: "George Carlin" },
  { text: "The optimist sees opportunity in every difficulty. The pessimist sees difficulty in every opportunity.", author: "Winston Churchill" },
  { text: "Change the way you look at things and the things you look at change.", author: "Wayne Dyer" },
  { text: "Just start.", author: "Unknown" },
  { text: "Breathe.", author: "Unknown" },
  { text: "Do more.", author: "Unknown" },
  { text: "Stay humble.", author: "Unknown" },
  { text: "Keep going.", author: "Unknown" },
  { text: "Be grateful.", author: "Unknown" },
  { text: "Stay focused.", author: "Unknown" },
  { text: "Never settle.", author: "Unknown" },
  { text: "Be relentless.", author: "Unknown" },
  { text: "Trust the process.", author: "Unknown" },
  { text: "Eyes on the prize.", author: "Unknown" },
  { text: "Level up.", author: "Unknown" },
  { text: "Make it happen.", author: "Unknown" },
  { text: "Earn it.", author: "Unknown" },
  { text: "Show up.", author: "Unknown" },
  { text: "Decide. Commit. Succeed.", author: "Unknown" },
  { text: "Think bigger.", author: "Unknown" },
  { text: "Rise and grind.", author: "Unknown" },
  { text: "Progress, not perfection.", author: "Unknown" },
  { text: "The secret of getting started is breaking your complex overwhelming tasks into small manageable tasks, and then starting on the first one.", author: "Mark Twain" },
  { text: "It is never too late to be what you might have been.", author: "George Eliot" },
  { text: "Not all those who wander are lost.", author: "J.R.R. Tolkien" },
  { text: "All we have to decide is what to do with the time that is given us.", author: "J.R.R. Tolkien" },
  { text: "Even darkness must pass. A new day will come.", author: "J.R.R. Tolkien" },
  { text: "Do I dare disturb the universe?", author: "T.S. Eliot" },
  { text: "I took the road less traveled by, and that has made all the difference.", author: "Robert Frost" },
  { text: "Write it on your heart that every day is the best day in the year.", author: "Ralph Waldo Emerson" },
  { text: "Nothing of me is original. I am the combined effort of everyone I've ever known.", author: "Chuck Palahniuk" },
  { text: "It's the possibility of having a dream come true that makes life interesting.", author: "Paulo Coelho" },
  { text: "When you want something, all the universe conspires in helping you to achieve it.", author: "Paulo Coelho" },
  { text: "There is only one thing that makes a dream impossible to achieve: the fear of failure.", author: "Paulo Coelho" },
  { text: "Tell me, what is it you plan to do with your one wild and precious life?", author: "Mary Oliver" },
  { text: "Instructions for living a life: Pay attention. Be astonished. Tell about it.", author: "Mary Oliver" },
  { text: "The important thing is not to stop questioning. Curiosity has its own reason for existing.", author: "Albert Einstein" },
  { text: "Science is the great antidote to the poison of enthusiasm and superstition.", author: "Adam Smith" },
  { text: "Intelligence is the ability to adapt to change.", author: "Stephen Hawking" },
  { text: "Life would be tragic if it weren't funny.", author: "Stephen Hawking" },
  { text: "Not only is the Universe stranger than we think, it is stranger than we can think.", author: "Werner Heisenberg" },
  { text: "The day science begins to study non-physical phenomena, it will make more progress in one decade than in all the previous centuries.", author: "Nikola Tesla" },
  { text: "If you want to find the secrets of the universe, think in terms of energy, frequency, and vibration.", author: "Nikola Tesla" },
  { text: "The present is theirs; the future, for which I really worked, is mine.", author: "Nikola Tesla" },
  { text: "The greatest scientists are artists as well.", author: "Albert Einstein" },
  { text: "If we knew what we were doing, it would not be called research, would it?", author: "Albert Einstein" },
  { text: "We cannot solve our problems with the same thinking we used when we created them.", author: "Albert Einstein" },
  { text: "The world as we have created it is a process of our thinking. It cannot be changed without changing our thinking.", author: "Albert Einstein" },
  { text: "Hope is being able to see that there is light despite all of the darkness.", author: "Desmond Tutu" },
  { text: "Faith is taking the first step even when you don't see the whole staircase.", author: "Martin Luther King Jr." },
  { text: "Hope is a waking dream.", author: "Aristotle" },
  { text: "Let your hopes, not your hurts, shape your future.", author: "Robert H. Schuller" },
  { text: "Hope sees the invisible, feels the intangible and achieves the impossible.", author: "Helen Keller" },
  { text: "Once you choose hope, anything's possible.", author: "Christopher Reeve" },
  { text: "We must accept finite disappointment, but never lose infinite hope.", author: "Martin Luther King Jr." },
  { text: "I believe that tomorrow is another day and I believe in miracles.", author: "Audrey Hepburn" },
  { text: "Where there is hope there is life.", author: "Anne Frank" },
  { text: "The very least you can do in your life is to figure out what you hope for.", author: "Barbara Kingsolver" },
  { text: "Freedom is not worth having if it does not include the freedom to make mistakes.", author: "Mahatma Gandhi" },
  { text: "For to be free is not merely to cast off one's chains, but to live in a way that respects and enhances the freedom of others.", author: "Nelson Mandela" },
  { text: "Freedom is the oxygen of the soul.", author: "Moshe Dayan" },
  { text: "None who have always been free can understand the terrible fascinating power of the hope of freedom to those who are not free.", author: "Pearl S. Buck" },
  { text: "Freedom lies in being bold.", author: "Robert Frost" },
  { text: "I am no bird; and no net ensnares me: I am a free human being with an independent will.", author: "Charlotte Brontë" },
  { text: "Expose yourself to your deepest fear; after that, fear has no power.", author: "Jim Morrison" },
  { text: "Independence is a heady draft, and if you drink it in your youth, it can have the same effect on the brain as young wine does.", author: "Maya Angelou" },
  { text: "No one outside ourselves can rule us inwardly.", author: "Buddha" },
  { text: "Success is not measured by what you accomplish but by the opposition you have encountered.", author: "Orison Swett Marden" },
  { text: "Success seems to be connected with action. Successful people keep moving.", author: "Conrad Hilton" },
  { text: "Develop an attitude of gratitude, and give thanks for everything that happens to you.", author: "Brian Tracy" },
  { text: "The will to succeed is important, but what's more important is the will to prepare.", author: "Bobby Knight" },
  { text: "Don't be distracted by criticism. Remember, the only taste of success some people have is when they take a bite out of you.", author: "Zig Ziglar" },
  { text: "Success is how high you bounce when you hit bottom.", author: "George S. Patton" },
  { text: "The price of success is hard work, dedication to the job at hand.", author: "Vince Lombardi" },
  { text: "I'd rather attempt to do something great and fail than to attempt to do nothing and succeed.", author: "Robert H. Schuller" },
  { text: "Success is never owned; it is only rented, and the rent is due every day.", author: "Rory Vaden" },
  { text: "There is no elevator to success. You have to take the stairs.", author: "Unknown" },
  { text: "Success is what happens after you have survived all your mistakes.", author: "Anuj Somany" },
  { text: "The difference between successful people and really successful people is that really successful people say no to almost everything.", author: "Warren Buffett" },
  { text: "Success in life is not for those who run fast, but for those who keep running and always on the move.", author: "Tokuda Shigeru" },
  { text: "The most important thing about a person is what they do with the minutes they have.", author: "Unknown" },
  { text: "Balance is not something you find, it's something you create.", author: "Jana Kingsford" },
  { text: "You can have it all. Just not all at once.", author: "Oprah Winfrey" },
  { text: "Never get so busy making a living that you forget to make a life.", author: "Dolly Parton" },
  { text: "The key to keeping your balance is knowing when you've lost it.", author: "Unknown" },
  { text: "Happiness is not a matter of intensity but of balance and order and rhythm and harmony.", author: "Thomas Merton" },
  { text: "In order to carry a positive action we must develop here a positive vision.", author: "Dalai Lama" },
  { text: "The main thing is to keep the main thing the main thing.", author: "Stephen Covey" },
  { text: "Do not lose yourself trying to hold onto someone who doesn't care about losing you.", author: "Unknown" },
  { text: "Sometimes you need to step outside, get some air, and remind yourself of who you are and where you want to be.", author: "Unknown" },
  { text: "The most common way people give up their power is by thinking they don't have any.", author: "Alice Walker" },
  { text: "No one can make you feel inferior without your consent.", author: "Eleanor Roosevelt" },

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function daysSince(dateStr) {
  return Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
}

function calcTargetProgress(goal) {
  const current = goal.currentValue || 0;
  const target = goal.targetValue;
  const start = goal.startValue || (goal.targetDirection === "decrease" ? current : 0);
  if (!target && target !== 0) return { pct: 0, isComplete: false };
  if (goal.targetDirection === "decrease") {
    // e.g. weight: start=85, target=60, current=72 → progress = (85-72)/(85-60) = 52%
    const totalDelta = start - target;
    if (totalDelta <= 0) return { pct: 100, isComplete: true };
    const achieved = start - current;
    const pct = Math.min(100, Math.max(0, Math.round((achieved / totalDelta) * 100)));
    return { pct, isComplete: pct >= 100 };
  } else {
    // increase (default): e.g. portfolio: start=0, target=100, current=40 → 40%
    if (target === 0) return { pct: current === 0 ? 100 : 0, isComplete: current === 0 };
    const pct = Math.min(100, Math.max(0, Math.round((current / target) * 100)));
    return { pct, isComplete: pct >= 100 };
  }
}

function scoreTask(task) {
  let score = 0;
  score += (2 - PRIORITY_ORDER[task.priority]) * 40;
  if (task.dueDate) {
    const todayMidnight = new Date(todayStr() + "T00:00:00");
    const dueMidnight = new Date(task.dueDate + "T00:00:00");
    const daysUntilDue = Math.floor((dueMidnight - todayMidnight) / 86400000);
    if (daysUntilDue < 0) score += 100;
    else if (daysUntilDue <= 1) score += 60;
    else if (daysUntilDue <= 3) score += 30;
    else if (daysUntilDue <= 7) score += 10;
  }
  score += Math.min(daysSince(task.createdAt), 14) * 2;
  return score;
}

function loadTasks() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const tasks = JSON.parse(saved);
      // Auto-delete completed tasks older than 8 days
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - 8);
      const cutoffStr = localDateStr(cutoff);
      return tasks.filter(t => {
        if (!t.completed) return true;
        if (!t.completedAt) return true; // keep legacy tasks with no completedAt
        return t.completedAt > cutoffStr;
      });
    }
  } catch (e) {}
  return [
    { id: generateId(), text: "Review quarterly report", priority: "high", category: "work", dueDate: "2026-03-18", completed: false, createdAt: "2026-03-14" },

// ── Firebase data layer ──
function useFirebaseSync(user) {
  const [syncStatus, setSyncStatus] = useState("offline"); // offline | syncing | synced | error
  const listenerRef = useRef(null);

  const getUserRef = (path) => {
    if (!firebaseDb || !user) return null;
    return firebaseDb.ref(`users/${user.uid}/${path}`);
  };

  const saveToCloud = useCallback((path, data) => {
    const ref = getUserRef(path);
    if (!ref) return;
    setSyncStatus("syncing");
    ref.set(data).then(() => setSyncStatus("synced")).catch(() => setSyncStatus("error"));
  }, [user]);

  const listenToCloud = useCallback((path, callback) => {
    const ref = getUserRef(path);
    if (!ref) return () => {};
    const handler = ref.on("value", (snapshot) => {
      const data = snapshot.val();
      if (data !== null) {
        callback(data);
        setSyncStatus("synced");
      }
    }, () => setSyncStatus("error"));
    return () => ref.off("value", handler);
  }, [user]);

  useEffect(() => {
    if (user) setSyncStatus("synced");
    else setSyncStatus("offline");
  }, [user]);

  return { syncStatus, saveToCloud, listenToCloud };
}

function localDateStr(date) {
  // Always use LOCAL timezone for date strings, not UTC
  const d = date || new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function todayStr() {
  return localDateStr(new Date());
}

function loadRecurLog() {
  try {
    const saved = localStorage.getItem(RECUR_LOG_KEY);
    if (saved) {
      const log = JSON.parse(saved);
      // Prune entries older than 7 days to prevent localStorage bloat
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - 7);
      const cutoffStr = localDateStr(cutoff);
      const pruned = {};
      Object.keys(log).forEach(key => {
        const datepart = key.split("_").pop();
        if (datepart >= cutoffStr) pruned[key] = true;
      });
      return pruned;
    }
  } catch (e) {}
  return {};
}

function saveRecurLog(log) {
  try { localStorage.setItem(RECUR_LOG_KEY, JSON.stringify(log)); } catch(e) {}
}

function shouldSpawnToday(rule) {
  const now = new Date();
  const dayOfWeek = now.getDay();
  const dayOfMonth = now.getDate();
  if (!rule.enabled) return false;
  if (rule.type === "daily") return true;
  if (rule.type === "weekdays") return dayOfWeek >= 1 && dayOfWeek <= 5;
  if (rule.type === "weekly") return (rule.days || []).includes(dayOfWeek);
  if (rule.type === "monthly") return (rule.monthDays || []).includes(dayOfMonth);
  return false;
}

function spawnRecurringTasks(rules, existingTasks) {
  const today = todayStr();
  const log = loadRecurLog();
  const newTasks = [];
  rules.forEach(rule => {
    if (!shouldSpawnToday(rule)) return;
    const logKey = rule.id + "_" + today;
    if (log[logKey]) {
      // Cross-check: if dedup log says spawned but no matching task exists, re-spawn
      const taskExists = existingTasks.some(t => t.recurringRuleId === rule.id && t.createdAt === today);
      if (taskExists) return;
      // Orphaned dedup entry — task was never actually created, allow re-spawn
    }
    newTasks.push({
      id: generateId(),
      text: rule.text,
      priority: rule.priority,
      category: rule.category,
      dueDate: today,
      completed: false,
      createdAt: today,
      recurringRuleId: rule.id,
    });
    log[logKey] = true;
  });
  saveRecurLog(log);
  return newTasks;
}

            <button onClick={onExport} style={{ fontSize: 10, color: "#6b7280", border: "1px solid #e5e7eb", background: "white", padding: "2px 8px", borderRadius: 5, cursor: "pointer" }}>⬇ Export</button>
            <button onClick={onSignOut} style={{ fontSize: 10, color: "#9ca3af", border: "1px solid #e5e7eb", background: "white", padding: "2px 8px", borderRadius: 5, cursor: "pointer" }}>Sign out</button>
          </div>
        </>
      ) : (
        <>
          <span style={{ color: "#9ca3af" }}>☁️ Sign in to sync across devices</span>
          <div style={{ display: "flex", gap: 4 }}>
            <button onClick={onExport} style={{ fontSize: 10, color: "#6b7280", border: "1px solid #e5e7eb", background: "white", padding: "2px 8px", borderRadius: 5, cursor: "pointer" }}>⬇ Export</button>
            <button onClick={onSignIn} style={{ fontSize: 10, background: "#3b82f6", color: "white", border: "none", padding: "3px 10px", borderRadius: 5, cursor: "pointer", fontWeight: 500 }}>Sign in</button>
          </div>
        </>
      )}
    </div>
  );
}

// ── Recurring Modal ──
function RecurringModal({ show, onClose, rules, onSave }) {
  const [localRules, setLocalRules] = useState(rules);
  const [adding, setAdding] = useState(false);
  const [newText, setNewText] = useState("");
  const [newType, setNewType] = useState("weekly");
  const [newDays, setNewDays] = useState([1]);
  const [newMonthDays, setNewMonthDays] = useState([1]);
  const [newPriority, setNewPriority] = useState("medium");
  const [newCategory, setNewCategory] = useState("work");
  const [editingId, setEditingId] = useState(null);
  const [editText, setEditText] = useState("");
  const [editType, setEditType] = useState("weekly");
  const [editDays, setEditDays] = useState([1]);
  const [editMonthDays, setEditMonthDays] = useState([1]);
  const [editPriority, setEditPriority] = useState("medium");
  const [editCategory, setEditCategory] = useState("work");

  useEffect(() => { setLocalRules(rules); }, [rules]);

  if (!show) return null;

  const toggleDay = (d) => setNewDays(prev => prev.includes(d) ? prev.filter(x => x !== d) : [...prev, d].sort());
  const toggleMonthDay = (d) => setNewMonthDays(prev => prev.includes(d) ? prev.filter(x => x !== d) : [...prev, d].sort());

  const addRule = () => {
    if (!newText.trim()) return;
    const rule = { id: generateId(), text: newText.trim(), type: newType, days: newType === "weekly" ? newDays : [], monthDays: newType === "monthly" ? newMonthDays : [], priority: newPriority, category: newCategory, enabled: true };
    const updated = [...localRules, rule];
    setLocalRules(updated);
    onSave(updated);
    setNewText(""); setNewDays([1]); setNewMonthDays([1]); setAdding(false);
  };

  const toggleEnabled = (id) => { const updated = localRules.map(r => r.id === id ? { ...r, enabled: !r.enabled } : r); setLocalRules(updated); onSave(updated); };
  const deleteRule = (id) => { const rule = localRules.find(r => r.id === id); if (rule && !confirm(`Delete recurring task "${rule.text}"?`)) return; const updated = localRules.filter(r => r.id !== id); setLocalRules(updated); onSave(updated); };

  const startEdit = (rule) => {
    setEditingId(rule.id);
    setEditText(rule.text);
    setEditType(rule.type);
    setEditDays(rule.days || []);
    setEditMonthDays(rule.monthDays || []);
    setEditPriority(rule.priority);
    setEditCategory(rule.category);
  };

  const saveEdit = () => {
    if (!editText.trim()) return;
    const updated = localRules.map(r => r.id === editingId ? {
      ...r,
      text: editText.trim(),
      type: editType,
      days: editType === "weekly" ? editDays : [],
      monthDays: editType === "monthly" ? editMonthDays : [],
      priority: editPriority,
      category: editCategory,
    } : r);
    setLocalRules(updated);
    onSave(updated);
    setEditingId(null);
  };

  const describeSchedule = (rule) => {
    if (rule.type === "daily") return "Every day";
    if (rule.type === "weekdays") return "Mon - Fri";
    if (rule.type === "weekly") return (rule.days || []).map(d => DAY_NAMES[d]).join(", ");
    if (rule.type === "monthly") return "Monthly on " + (rule.monthDays || []).map(d => d + getSuffix(d)).join(", ");
    return "";
  };

  const getSuffix = (n) => { if (n >= 11 && n <= 13) return "th"; if (n % 10 === 1) return "st"; if (n % 10 === 2) return "nd"; if (n % 10 === 3) return "rd"; return "th"; };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e => e.stopPropagation()}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
          <h2 style={{ margin: 0, fontSize: 18, fontWeight: 700, color: "#1f2937" }}>Recurring Tasks</h2>
          <button onClick={onClose} style={{ border: "none", background: "none", fontSize: 18, cursor: "pointer", color: "#9ca3af" }}>✕</button>
        </div>
        <p style={{ fontSize: 12, color: "#6b7280", marginTop: 0, marginBottom: 16 }}>Set up tasks that automatically appear on specific days. They'll be created fresh each time the page loads on a scheduled day.</p>

        {localRules.length === 0 && !adding && (
          <div style={{ textAlign: "center", padding: "24px 0", color: "#9ca3af" }}><p style={{ fontSize: 24, marginBottom: 4 }}>🔄</p><p style={{ fontSize: 13 }}>No recurring tasks yet</p></div>
        )}

        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
          {localRules.map(rule => {
            const pMeta = PRIORITY_META.find(p => p.value === rule.priority) || PRIORITY_META[1];
            return (
              <div key={rule.id} style={{ background: rule.enabled ? "#f9fafb" : "#f3f4f6", border: "1px solid #e5e7eb", borderRadius: 10, padding: 12, opacity: rule.enabled ? 1 : 0.6 }}>
                <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 8 }}>
                  <div style={{ flex: 1 }}>
                    <p style={{ margin: 0, fontSize: 13, fontWeight: 500, color: "#1f2937" }}>{rule.text}</p>
                    <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 6, flexWrap: "wrap" }}>
                      <span style={{ fontSize: 10, background: "#e0e7ff", color: "#4338ca", padding: "1px 6px", borderRadius: 8 }}>🔄 {describeSchedule(rule)}</span>
                      <span style={{ fontSize: 10, background: pMeta.bg, color: pMeta.color, padding: "1px 6px", borderRadius: 8 }}>{pMeta.icon} {pMeta.label}</span>
                      <CategoryBadge category={rule.category} />
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                    <button onClick={() => toggleEnabled(rule.id)} style={{ fontSize: 11, background: rule.enabled ? "#dcfce7" : "#fee2e2", color: rule.enabled ? "#16a34a" : "#dc2626", border: "none", padding: "3px 8px", borderRadius: 6, cursor: "pointer" }}>{rule.enabled ? "On" : "Off"}</button>
                    <button onClick={() => startEdit(rule)} style={{ fontSize: 11, background: "#eff6ff", color: "#2563eb", border: "1px solid #bfdbfe", padding: "3px 8px", borderRadius: 6, cursor: "pointer" }}>Edit</button>
                    <button onClick={() => deleteRule(rule.id)} style={{ fontSize: 13, color: "#9ca3af", border: "none", background: "none", cursor: "pointer" }}>✕</button>
                  </div>
                </div>
                {editingId === rule.id && (
                  <div style={{ borderTop: "1px solid #e5e7eb", padding: "10px 0 4px", marginTop: 8 }}>
                    <input autoFocus value={editText} onChange={e => setEditText(e.target.value)} style={{ width: "100%", border: "1px solid #d1d5db", borderRadius: 8, padding: "7px 10px", fontSize: 13, outline: "none", boxSizing: "border-box", marginBottom: 8 }} onKeyDown={e => { if (e.key === "Enter") saveEdit(); if (e.key === "Escape") setEditingId(null); }} />
                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
                      <select value={editType} onChange={e => setEditType(e.target.value)} style={{ fontSize: 12, border: "1px solid #d1d5db", borderRadius: 6, padding: "4px 8px" }}>{RECUR_TYPES.map(r => <option key={r.value} value={r.value}>{r.label}</option>)}</select>
                      <select value={editCategory} onChange={e => setEditCategory(e.target.value)} style={{ fontSize: 12, border: "1px solid #d1d5db", borderRadius: 6, padding: "4px 8px" }}>{CATEGORIES.map(c => <option key={c.value} value={c.value}>{c.icon} {c.label}</option>)}</select>
                    </div>
                    {editType === "weekly" && <div style={{ display: "flex", gap: 4, marginBottom: 8 }}>{DAY_NAMES.map((name, i) => (<button key={i} className={`day-chip ${editDays.includes(i) ? "active" : ""}`} onClick={() => setEditDays(prev => prev.includes(i) ? prev.filter(x => x !== i) : [...prev, i].sort())}>{name}</button>))}</div>}
                    {editType === "monthly" && <div style={{ display: "flex", gap: 3, flexWrap: "wrap", marginBottom: 8 }}>{Array.from({ length: 31 }, (_, i) => i + 1).map(d => (<button key={d} className={`day-chip monthly ${editMonthDays.includes(d) ? "active" : ""}`} onClick={() => setEditMonthDays(prev => prev.includes(d) ? prev.filter(x => x !== d) : [...prev, d].sort())}>{d}</button>))}</div>}
                    <PriorityPicker value={editPriority} onChange={setEditPriority} />
                    <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                      <button onClick={saveEdit} style={{ background: "#3b82f6", color: "white", border: "none", padding: "5px 14px", borderRadius: 7, fontSize: 12, fontWeight: 500, cursor: "pointer" }}>Save</button>
                      <button onClick={() => setEditingId(null)} style={{ background: "white", color: "#6b7280", border: "1px solid #d1d5db", padding: "5px 12px", borderRadius: 7, fontSize: 12, cursor: "pointer" }}>Cancel</button>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {adding ? (
          <div style={{ background: "#f0f9ff", border: "1px solid #bae6fd", borderRadius: 10, padding: 14 }}>
            <p style={{ margin: "0 0 10px", fontSize: 13, fontWeight: 600, color: "#0c4a6e" }}>New recurring task</p>
            <input autoFocus style={{ width: "100%", border: "1px solid #d1d5db", borderRadius: 8, padding: "8px 12px", fontSize: 13, outline: "none", boxSizing: "border-box", marginBottom: 10 }} placeholder="Task name..." value={newText} onChange={e => setNewText(e.target.value)} onKeyDown={e => { if (e.key === "Enter") addRule(); }} />
            <div style={{ display: "flex", gap: 12, marginBottom: 10, flexWrap: "wrap", alignItems: "center" }}>
              <div>
                <label style={{ fontSize: 11, color: "#6b7280", fontWeight: 600, display: "block", marginBottom: 4 }}>Schedule</label>
                <select value={newType} onChange={e => setNewType(e.target.value)} style={{ fontSize: 12, border: "1px solid #d1d5db", borderRadius: 6, padding: "4px 8px" }}>{RECUR_TYPES.map(r => <option key={r.value} value={r.value}>{r.label}</option>)}</select>
              </div>
              <div>
                <label style={{ fontSize: 11, color: "#6b7280", fontWeight: 600, display: "block", marginBottom: 4 }}>Category</label>
                <select value={newCategory} onChange={e => setNewCategory(e.target.value)} style={{ fontSize: 12, border: "1px solid #d1d5db", borderRadius: 6, padding: "4px 8px" }}>{CATEGORIES.map(c => <option key={c.value} value={c.value}>{c.icon} {c.label}</option>)}</select>
              </div>
            </div>
            {newType === "weekly" && (
              <div style={{ marginBottom: 10 }}>
                <label style={{ fontSize: 11, color: "#6b7280", fontWeight: 600, display: "block", marginBottom: 6 }}>Pick days</label>
                <div style={{ display: "flex", gap: 4 }}>{DAY_NAMES.map((name, i) => (<button key={i} className={`day-chip ${newDays.includes(i) ? "active" : ""}`} onClick={() => toggleDay(i)}>{name}</button>))}</div>
              </div>
            )}
            {newType === "monthly" && (
              <div style={{ marginBottom: 10 }}>
                <label style={{ fontSize: 11, color: "#6b7280", fontWeight: 600, display: "block", marginBottom: 6 }}>Pick date(s) of the month</label>
                <div style={{ display: "flex", gap: 3, flexWrap: "wrap" }}>{Array.from({ length: 31 }, (_, i) => i + 1).map(d => (<button key={d} className={`day-chip monthly ${newMonthDays.includes(d) ? "active" : ""}`} onClick={() => toggleMonthDay(d)}>{d}</button>))}</div>
                {newMonthDays.some(d => d > 28) && <p style={{ fontSize: 10, color: "#f59e0b", marginTop: 6, marginBottom: 0 }}>⚠️ Days 29-31 won't trigger in shorter months</p>}
              </div>
            )}
            <div style={{ marginBottom: 12 }}>
              <label style={{ fontSize: 11, color: "#6b7280", fontWeight: 600, display: "block", marginBottom: 6 }}>Priority</label>
              <PriorityPicker value={newPriority} onChange={setNewPriority} />
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={addRule} style={{ background: "#3b82f6", color: "white", border: "none", padding: "6px 16px", borderRadius: 8, fontSize: 12, fontWeight: 500, cursor: "pointer" }}>Save Rule</button>
              <button onClick={() => setAdding(false)} style={{ background: "white", color: "#6b7280", border: "1px solid #d1d5db", padding: "6px 16px", borderRadius: 8, fontSize: 12, cursor: "pointer" }}>Cancel</button>
            </div>
          </div>
        ) : (
          <button onClick={() => setAdding(true)} style={{ width: "100%", background: "#f0f9ff", color: "#2563eb", border: "1px dashed #93c5fd", padding: "10px", borderRadius: 8, fontSize: 12, fontWeight: 500, cursor: "pointer" }}>+ Add Recurring Task</button>
        )}
      </div>
    </div>
  );
}

function CategoryBadge({ category }) {
  const cat = CATEGORIES.find(c => c.value === category) || CATEGORIES[CATEGORIES.length - 1];
  return (<span style={{ background: cat.bg, color: cat.color, border: `1px solid ${cat.color}30`, fontSize: 11, padding: "1px 6px", borderRadius: 10, fontWeight: 500, whiteSpace: "nowrap" }}>{cat.icon} {cat.label}</span>);
}

function CategoryTabs({ active, onChange, counts }) {
  return (
    <div className="cat-tabs" style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
      <button onClick={() => onChange("all")} style={{ padding: "6px 14px", borderRadius: 20, fontSize: 12, fontWeight: 600, cursor: "pointer", border: "1px solid", background: active === "all" ? "#1f2937" : "white", color: active === "all" ? "white" : "#4b5563", borderColor: active === "all" ? "#1f2937" : "#e5e7eb" }}>All ({counts.all})</button>
      {CATEGORIES.map(cat => (
        <button key={cat.value} onClick={() => onChange(cat.value)} style={{ padding: "6px 14px", borderRadius: 20, fontSize: 12, fontWeight: 500, cursor: "pointer", border: "1px solid", background: active === cat.value ? cat.color : "white", color: active === cat.value ? "white" : cat.color, borderColor: active === cat.value ? cat.color : `${cat.color}40` }}>{cat.icon} {cat.label} ({counts[cat.value] || 0})</button>
      ))}
    </div>
  );
}

const PRIORITY_META = [
  { value: "high", label: "High", icon: "🔴", color: "#ef4444", bg: "#fef2f2" },
  { value: "medium", label: "Medium", icon: "🟡", color: "#f59e0b", bg: "#fffbeb" },
  { value: "low", label: "Low", icon: "🟢", color: "#22c55e", bg: "#f0fdf4" },
];

function PriorityPicker({ value, onChange, size }) {
  const isSmall = size === "small";
  return (
    <div style={{ display: "flex", gap: isSmall ? 3 : 4, alignItems: "center" }}>
      {PRIORITY_META.map(p => {
        const isActive = value === p.value;
        return (<button key={p.value} onClick={() => onChange(p.value)} title={`${p.label} priority`} className={`pri-btn ${isActive ? "active" : ""}`} style={{ background: isActive ? p.color : p.bg, color: isActive ? "white" : p.color, border: `1.5px solid ${isActive ? p.color : p.color + "50"}`, padding: isSmall ? "2px 7px" : "4px 10px", fontSize: isSmall ? 10 : 11 }}>{isSmall ? p.icon : `${p.icon} ${p.label}`}</button>);
      })}
    </div>
  );
}

// ── Goals Panel (Hierarchical) ──
const GOAL_LEVELS = [
  { key: "20y", label: "20-Year Vision", short: "20Y", icon: "🌟", color: "#7c3aed", bg: "#f5f3ff", border: "#c4b5fd", childLabel: "Break into 10-Year Goals" },
  { key: "10y", label: "10-Year Goals", short: "10Y", icon: "🎯", color: "#2563eb", bg: "#eff6ff", border: "#93c5fd", childLabel: "Break into 5-Year Goals" },
  { key: "5y", label: "5-Year Goals", short: "5Y", icon: "🚀", color: "#0891b2", bg: "#ecfeff", border: "#67e8f9", childLabel: "Break into 1-Year Goals" },
  { key: "1y", label: "1-Year Goals", short: "1Y", icon: "📅", color: "#059669", bg: "#ecfdf5", border: "#6ee7b7", childLabel: "Break into Monthly Goals" },
