          <Dashboard tasks={tasks} goals={goals} recurringRules={recurringRules} />
        )}

        {activeTab === "tasks" && (
        <>
        {/* Category tabs */}
        <div style={{ marginBottom: 8 }}><CategoryTabs active={filterCategory} onChange={setFilterCategory} counts={categoryCounts} /></div>

        {/* Input */}
        <div style={{ background: "white", borderRadius: 10, border: `1px solid ${showInputExtras ? "#bfdbfe" : "#e5e7eb"}`, padding: "6px 8px", marginBottom: 8, boxShadow: showInputExtras ? "0 0 0 2px #eff6ff" : "0 1px 3px rgba(0,0,0,0.06)", transition: "border-color 0.15s, box-shadow 0.15s" }}
          onBlur={e => { if (!e.currentTarget.contains(e.relatedTarget)) setShowInputExtras(false); }}>
          <div style={{ display: "flex", gap: 5, alignItems: "center" }}>
            <select value={newCategory} onChange={e => setNewCategory(e.target.value)} style={{ fontSize: 11, background: "white", border: "1px solid #e5e7eb", borderRadius: 6, padding: "4px 5px", flexShrink: 0, color: "#374151" }}>{CATEGORIES.map(c => <option key={c.value} value={c.value}>{c.icon} {c.label}</option>)}</select>
            <input ref={inputRef} style={{ flex: 1, background: "#f9fafb", border: "1px solid #e5e7eb", borderRadius: 6, padding: "5px 10px", fontSize: 13, outline: "none", minWidth: 0, boxSizing: "border-box" }} placeholder="Add a task… (!! high · ! med · ~ low)" value={input} onChange={e => setInput(e.target.value)} onFocus={() => setShowInputExtras(true)} onKeyDown={e => { if (e.key === "Enter") { addTask(); setShowInputExtras(false); } if (e.key === "Escape") { setShowInputExtras(false); inputRef.current && inputRef.current.blur(); } }} />
            <button onClick={() => { addTask(); setShowInputExtras(false); }} style={{ background: "#3b82f6", color: "white", border: "none", padding: "5px 13px", borderRadius: 6, fontSize: 13, fontWeight: 500, cursor: "pointer", flexShrink: 0 }}>Add</button>
          </div>
          {showInputExtras && (
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 6, paddingTop: 6, borderTop: "1px dashed #e5e7eb", flexWrap: "wrap" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                <span style={{ fontSize: 10, color: "#9ca3af", fontWeight: 600 }}>Priority:</span>
                <PriorityPicker value={newPriority} onChange={setNewPriority} />
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                <span style={{ fontSize: 10, color: "#9ca3af", fontWeight: 600 }}>Due:</span>
                <input type="date" value={newDueDate} onChange={e => setNewDueDate(e.target.value)} style={{ fontSize: 11, background: "white", border: "1px solid #e5e7eb", borderRadius: 6, padding: "3px 6px" }} />
                {newDueDate && <button onClick={() => setNewDueDate("")} style={{ fontSize: 11, color: "#9ca3af", background: "none", border: "none", cursor: "pointer", padding: 0 }}>✕</button>}
              </div>
            </div>
          )}
        </div>

        {/* Search + Controls — single compact row */}
        <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 8, flexWrap: "wrap" }}>
          <div style={{ position: "relative", flex: 1, minWidth: 140 }}>
            <span style={{ position: "absolute", left: 9, top: "50%", transform: "translateY(-50%)", fontSize: 12, color: "#9ca3af", pointerEvents: "none" }}>🔍</span>
            <input
              style={{ width: "100%", background: "white", border: "1px solid #e5e7eb", borderRadius: 8, padding: "6px 28px 6px 28px", fontSize: 12, outline: "none", boxSizing: "border-box" }}
              placeholder="Search..."
              value={searchQuery}
              onChange={e => setSearchQuery(e.target.value)}
            />
            {searchQuery && <button onClick={() => setSearchQuery("")} style={{ position: "absolute", right: 7, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", cursor: "pointer", fontSize: 13, color: "#9ca3af", padding: 0 }}>✕</button>}
          </div>
          <select style={{ fontSize: 11, background: "white", border: "1px solid #e5e7eb", borderRadius: 8, padding: "6px 6px", flexShrink: 0 }} value={sortBy} onChange={e => setSortBy(e.target.value)} title="Sort by">
            <option value="manual">⠿ Manual</option><option value="priority">⚡ Priority</option><option value="category">📁 Category</option><option value="dueDate">📅 Due Date</option><option value="newest">🆕 Newest</option><option value="oldest">🕰 Oldest</option><option value="smart">★ Smart</option>
          </select>
          <select style={{ fontSize: 11, background: "white", border: "1px solid #e5e7eb", borderRadius: 8, padding: "6px 6px", flexShrink: 0 }} value={filterPriority} onChange={e => setFilterPriority(e.target.value)} title="Filter priority">
            <option value="all">🎯 All</option><option value="high">🔴 High</option><option value="medium">🟡 Med</option><option value="low">🟢 Low</option>
          </select>
          <button onClick={() => setShowRecurring(true)} style={{ background: "#faf5ff", color: "#7c3aed", border: "1px solid #c4b5fd", padding: "6px 10px", borderRadius: 8, fontSize: 11, fontWeight: 500, cursor: "pointer", flexShrink: 0, whiteSpace: "nowrap" }}>🔄</button>
          <button onClick={suggestNext} style={{ background: "#eff6ff", color: "#2563eb", border: "1px solid #bfdbfe", padding: "6px 10px", borderRadius: 8, fontSize: 11, fontWeight: 600, cursor: "pointer", flexShrink: 0, whiteSpace: "nowrap" }}>★ Suggest</button>
        </div>

        {sortBy === "manual" && sorted.length > 1 && (
          <div style={{ background: "#f0fdf4", border: "1px solid #bbf7d0", borderRadius: 8, padding: "8px 12px", marginBottom: 8, fontSize: 12, color: "#15803d", display: "flex", alignItems: "center", gap: 6 }}><span style={{ fontSize: 16 }}>⠿</span> Drag the handle to reorder tasks</div>
        )}

        {/* Suggestion banner */}
        {currentSuggestion && (() => {
          const suggestedTask = tasks.find(t => t.id === currentSuggestion.id);
          if (!suggestedTask) return null;
          const isLast = suggestionIndex >= suggestionList.length - 1;
          return (
            <div style={{ background: "#eff6ff", border: "1px solid #bfdbfe", borderRadius: 10, padding: 14, marginBottom: 16 }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
                <span style={{ fontSize: 11, color: "#6b8cce", fontWeight: 600 }}>Suggestion {suggestionIndex + 1} of {suggestionList.length}</span>
                <span style={{ fontSize: 10, color: "#93aed4", background: "#dbeafe", padding: "2px 8px", borderRadius: 8 }}>Score: {currentSuggestion.score}</span>
              </div>
              <p onClick={() => { const el = document.getElementById(`task-${suggestedTask.id}`); if (el) { const y = el.getBoundingClientRect().top + window.pageYOffset - (window.innerHeight / 3); window.scrollTo({ top: y, behavior: "smooth" }); setTimeout(() => { el.style.transition = "box-shadow 0.3s"; el.style.boxShadow = "0 0 0 3px #60a5fa, 0 0 12px rgba(96,165,250,0.4)"; setTimeout(() => { el.style.boxShadow = ""; }, 2000); }, 400); } }} style={{ fontSize: 14, color: "#1d4ed8", margin: 0, fontWeight: 500, cursor: "pointer" }}>★ {suggestedTask.text}<span style={{ marginLeft: 8 }}><CategoryBadge category={suggestedTask.category} /></span> <span style={{ fontSize: 10, color: "#93aed4" }}>↓ tap to scroll</span></p>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                {suggestionIndex > 0 && <button onClick={() => setSuggestionIndex(prev => prev - 1)} style={{ background: "#f0fdf4", color: "#16a34a", border: "1px solid #86efac", padding: "5px 14px", borderRadius: 8, fontSize: 12, fontWeight: 500, cursor: "pointer" }}>← Previous</button>}
                {!isLast && <button onClick={skipSuggestion} style={{ background: "#dbeafe", color: "#2563eb", border: "1px solid #93c5fd", padding: "5px 14px", borderRadius: 8, fontSize: 12, fontWeight: 500, cursor: "pointer" }}>Skip → Show Next</button>}
                {isLast && suggestionList.length > 1 && <button onClick={() => setSuggestionIndex(0)} style={{ background: "#dbeafe", color: "#2563eb", border: "1px solid #93c5fd", padding: "5px 14px", borderRadius: 8, fontSize: 12, fontWeight: 500, cursor: "pointer" }}>↻ Back to Top Pick</button>}
                <button onClick={dismissSuggestions} style={{ background: "transparent", color: "#93c5fd", border: "1px solid #bfdbfe", padding: "5px 14px", borderRadius: 8, fontSize: 12, cursor: "pointer" }}>Dismiss</button>
                {isLast && <span style={{ fontSize: 11, color: "#93aed4", marginLeft: 4 }}>No more suggestions</span>}
              </div>
            </div>
          );
        })()}

        {/* Today's Focus Section */}
        {(() => {
          const overdueTasks = sorted.filter(t => !t.completed && t.dueDate && t.dueDate < todayDate && !t.recurringRuleId);
          const dueTodayTasks = sorted.filter(t => !t.completed && t.dueDate === todayDate && !t.recurringRuleId);
          const recurringToday = sorted.filter(t => !t.completed && t.recurringRuleId);
          const todayTasks = [...overdueTasks, ...dueTodayTasks, ...recurringToday];
          if (todayTasks.length === 0) return null;
          return (
            <div style={{ marginBottom: 16 }}>
              <button onClick={() => setShowTodaySection(prev => !prev)} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", background: "linear-gradient(135deg, #fefce8, #fffbeb)", border: "1px solid #fcd34d", borderRadius: 10, padding: "10px 14px", cursor: "pointer", marginBottom: showTodaySection ? 8 : 0 }}>
                <span style={{ fontSize: 13, fontWeight: 600, color: "#92400e" }}>⚡ Today's Focus ({todayTasks.length})</span>
                <span style={{ fontSize: 12, color: "#d97706", transition: "transform 0.2s", transform: showTodaySection ? "rotate(180deg)" : "rotate(0deg)" }}>▼</span>
              </button>
              {showTodaySection && (
                <div style={{ display: "flex", flexDirection: "column", gap: 6, paddingLeft: 4 }}>
                  {overdueTasks.length > 0 && <p style={{ fontSize: 10, color: "#b91c1c", fontWeight: 600, margin: "4px 0 2px", paddingLeft: 4 }}>🚨 Overdue</p>}
                  {overdueTasks.map(task => (
                    <div key={task.id} onClick={() => { const el = document.getElementById(`task-${task.id}`); if (el) { const y = el.getBoundingClientRect().top + window.pageYOffset - (window.innerHeight / 3); window.scrollTo({ top: y, behavior: "smooth" }); setTimeout(() => { el.style.transition = "box-shadow 0.3s"; el.style.boxShadow = "0 0 0 3px #ef4444, 0 0 12px rgba(239,68,68,0.4)"; setTimeout(() => { el.style.boxShadow = ""; }, 2000); }, 400); }}} style={{ background: "#fff5f5", border: "1px solid #fecaca", borderLeft: "3px solid #ef4444", borderRadius: 8, padding: "8px 12px", cursor: "pointer", display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ fontSize: 12, color: "#1f2937", flex: 1 }}>{task.text}</span>
                      <span style={{ fontSize: 10, color: "#dc2626", fontWeight: 600 }}>{(() => { const days = Math.floor((new Date(todayDate + "T00:00:00") - new Date(task.dueDate + "T00:00:00")) / 86400000); return days === 1 ? "1d late" : `${days}d late`; })()}</span>
                      <CategoryBadge category={task.category} />
                    </div>
                  ))}
                  {dueTodayTasks.length > 0 && <p style={{ fontSize: 10, color: "#b45309", fontWeight: 600, margin: "4px 0 2px", paddingLeft: 4 }}>📅 Due today</p>}
                  {dueTodayTasks.map(task => (
                    <div key={task.id} onClick={() => { const el = document.getElementById(`task-${task.id}`); if (el) { const y = el.getBoundingClientRect().top + window.pageYOffset - (window.innerHeight / 3); window.scrollTo({ top: y, behavior: "smooth" }); setTimeout(() => { el.style.transition = "box-shadow 0.3s"; el.style.boxShadow = "0 0 0 3px #fbbf24, 0 0 12px rgba(251,191,36,0.4)"; setTimeout(() => { el.style.boxShadow = ""; }, 2000); }, 400); }}} style={{ background: "white", border: "1px solid #fde68a", borderLeft: "3px solid #f59e0b", borderRadius: 8, padding: "8px 12px", cursor: "pointer", display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ fontSize: 12, color: "#1f2937", flex: 1 }}>{task.text}</span>
                      <CategoryBadge category={task.category} />
                    </div>
                  ))}
                  {recurringToday.length > 0 && <p style={{ fontSize: 10, color: "#7c3aed", fontWeight: 600, margin: "4px 0 2px", paddingLeft: 4 }}>🔄 Recurring today</p>}
                  {recurringToday.map(task => (
                    <div key={task.id} onClick={() => { const el = document.getElementById(`task-${task.id}`); if (el) { const y = el.getBoundingClientRect().top + window.pageYOffset - (window.innerHeight / 3); window.scrollTo({ top: y, behavior: "smooth" }); setTimeout(() => { el.style.transition = "box-shadow 0.3s"; el.style.boxShadow = "0 0 0 3px #a78bfa, 0 0 12px rgba(167,139,250,0.4)"; setTimeout(() => { el.style.boxShadow = ""; }, 2000); }, 400); }}} style={{ background: "white", border: "1px solid #e9d5ff", borderLeft: "3px solid #7c3aed", borderRadius: 8, padding: "8px 12px", cursor: "pointer", display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ fontSize: 12, color: "#1f2937", flex: 1 }}>{task.text}</span>
                      <CategoryBadge category={task.category} />
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })()}

        {/* Task list */}
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {sorted.length === 0 ? (
            <div style={{ textAlign: "center", padding: "48px 0", color: "#9ca3af" }}><p style={{ fontSize: 28, marginBottom: 8 }}>🎯</p><p style={{ fontSize: 13 }}>No tasks here. Type something above to get started!</p></div>
          ) : sorted.map((task, i) => (
            <TaskItem key={task.id} task={task} onToggle={toggleTask} onDelete={deleteTask} onUpdate={updateTask} isSuggested={currentSuggestion && currentSuggestion.id === task.id} isDragging={dragId === task.id} dragOverPos={dragOverState.id === task.id ? dragOverState.pos : null} onDragStart={handleDragStart} onDragEnd={handleDragEnd} onDragOver={handleDragOver} onDragLeave={handleDragLeave} onDrop={handleDrop} sortBy={sortBy} />
          ))}
        </div>

        {/* Completed Tasks Section */}
        {completedCount > 0 && (
          <div style={{ marginTop: 20 }}>
            <button onClick={() => setShowCompletedSection(prev => !prev)} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", background: "#f9fafb", border: "1px solid #e5e7eb", borderRadius: 10, padding: "10px 14px", cursor: "pointer", transition: "all 0.15s" }}>
              <span style={{ fontSize: 13, fontWeight: 600, color: "#6b7280" }}>✅ Completed Tasks ({completedCount})</span>
              <span style={{ fontSize: 12, color: "#9ca3af", transition: "transform 0.2s", transform: showCompletedSection ? "rotate(180deg)" : "rotate(0deg)" }}>▼</span>
            </button>
            {showCompletedSection && (
              <div style={{ marginTop: 8 }}>
                <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 8 }}>
                  <button onClick={clearCompleted} style={{ background: "#fef2f2", color: "#dc2626", border: "1px solid #fecaca", padding: "6px 14px", borderRadius: 8, fontSize: 11, fontWeight: 500, cursor: "pointer" }}>🗑 Remove All Completed</button>
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  {tasks.filter(t => t.completed).map(task => {
                    const pColors = PRIORITY_COLORS[task.priority];
                    const cat = CATEGORIES.find(c => c.value === task.category) || CATEGORIES[CATEGORIES.length - 1];
                    return (
                      <div key={task.id} style={{ background: "#f9fafb", borderLeft: `3px solid ${pColors.badge}`, borderRadius: 8, border: "1px solid #e5e7eb", borderLeftWidth: 3, borderLeftColor: pColors.badge, padding: "10px 12px", opacity: 0.7 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          <button onClick={() => toggleTask(task.id)} style={{ width: 20, height: 20, borderRadius: "50%", border: "2px solid #9ca3af", background: "#9ca3af", color: "white", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, flexShrink: 0 }}>✓</button>
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <p style={{ margin: 0, fontSize: 13, color: "#9ca3af", textDecoration: "line-through", wordBreak: "break-word" }}>{task.text}</p>
                            <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 4, flexWrap: "wrap" }}>
                              <span style={{ background: pColors.badge + "30", color: pColors.badge, fontSize: 10, padding: "1px 6px", borderRadius: 4 }}>{task.priority}</span>
                              <span style={{ fontSize: 10, background: cat.bg, color: cat.color, padding: "1px 6px", borderRadius: 10 }}>{cat.icon} {cat.label}</span>
                              {task.completedAt && <span style={{ fontSize: 10, color: "#9ca3af" }}>Done: {new Date(task.completedAt + "T00:00:00").toLocaleDateString()}</span>}
                              {task.recurringRuleId && <span style={{ fontSize: 10, background: "#f5f3ff", color: "#7c3aed", padding: "1px 5px", borderRadius: 8 }}>🔄</span>}
                            </div>
                          </div>
                          <button onClick={() => { setTasks(prev => prev.filter(t => t.id !== task.id)); }} style={{ color: "#d1d5db", border: "none", background: "none", cursor: "pointer", fontSize: 13, flexShrink: 0 }}>✕</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        )}

        {/* Quick tips */}
        <div style={{ background: "white", borderRadius: 12, border: "1px solid #e5e7eb", padding: 16, marginTop: 24 }}>
          <p style={{ fontSize: 11, fontWeight: 600, color: "#6b7280", marginBottom: 8, marginTop: 0 }}>Quick tips</p>
          <div style={{ fontSize: 11, color: "#9ca3af", lineHeight: 1.8 }}>
            Click priority buttons (🔴 🟡 🟢) to set or change priority. Drag ⠿ to reorder (Manual mode). Use category tabs to filter. Double-click to edit. 🔄 Recurring for auto-repeating tasks. Sign in with Google to sync across all your devices.
          </div>
        </div>
        </>
        )}

        {activeTab === "goals" && (
          <GoalsPanel goals={goals} onUpdate={setGoals} onCreateRecurring={(rule) => {
            const updated = [...recurringRules, rule];
            handleSaveRules(updated);
          }} />
        )}
      </div>

      <RecurringModal show={showRecurring} onClose={() => setShowRecurring(false)} rules={recurringRules} onSave={handleSaveRules} />
    </div>
  );
}

ReactDOM.render(<TaskManager />, document.getElementById("root"));
</script>
<script>
// Register Service Worker for PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
